<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="title desc">
  <title id="title">When Ecosystem Disturbances Compound</title>
  <desc id="desc">An abstract global ecosystem motif combining a globe grid, vegetation contours, drought rings and a fire-coloured signal path.</desc>
