<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Compound ecosystem disturbance observatory artwork</title>
  <desc id="desc">A dark scientific illustration of a globe, ecological contour lines and three intersecting environmental signal paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101d32"/><stop offset=".56" stop-color="#17384a"/><stop offset="1" stop-color="#102c34"/></linearGradient>
    <radialGradient id="halo"><stop offset="0" stop-color="#5ca99a" stop-opacity=".28"/><stop offset="1" stop-color="#5ca99a" stop-opacity="0"/></radialGradient>
    <linearGradient id="globe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8d6b6"/><stop offset=".52" stop-color="#6d9d83"/><stop offset="1" stop-color="#315d55"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#d5a071" stop-opacity=".12"/><stop offset=".5" stop-color="#d8c18e" stop-opacity=".95"/><stop offset="1" stop-color="#8fd2c3" stop-opacity=".16"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#d8e7e4" stroke-opacity=".045"/></pattern>
    <clipPath id="globeClip"><circle cx="835" cy="210" r="150"/></clipPath>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
