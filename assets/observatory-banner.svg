    <radialGradient id="orb"><stop offset="0" stop-color="#dce4c9"/><stop offset=".7" stop-color="#8fae8e"/><stop offset="1" stop-color="#47745a"/></radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d6a27a"/><stop offset=".5" stop-color="#e8c79b"/><stop offset="1" stop-color="#a5bd91"/></linearGradient>
    <clipPath id="globe"><circle cx="1210" cy="205" r="154"/></clipPath>
  </defs>
