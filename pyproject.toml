[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compound-ecosystem-observatory"
version = "0.1.0"
description = "A reproducible probabilistic research framework for compound ecosystem disturbances."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Kamrul Hassan"}]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.4"]

[tool.setuptools]
packages = ["analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
